name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version in the script matches the tag
        run: |
          v=$(sed -n 's/^VERSION="\(.*\)"$/\1/p' git-worktree-clean)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "script says $v, tag is $GITHUB_REF_NAME"; exit 1; }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum git-worktree-clean > git-worktree-clean.sha256
          gh release create "$GITHUB_REF_NAME" git-worktree-clean git-worktree-clean.sha256 \
            --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md"
